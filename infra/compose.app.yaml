name: gameopen-demo
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: gameops
      POSTGRES_PASSWORD: local_container_demo_only
      POSTGRES_DB: gameops
    volumes:
      - demo_database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gameops -d gameops"]
      interval: 3s
      timeout: 3s
      retries: 20
  portal:
    build:
      context: ..
      target: runtime
    init: true
    environment:
      DATABASE_URL: postgresql://gameops:local_container_demo_only@postgres:5432/gameops
      APP_ORIGIN: https://localhost:8443
      CSRF_SECRET: ${CSRF_SECRET:?Run npm run setup first and pass --env-file .env}
    depends_on:
      postgres:
        condition: service_healthy
  https:
    image: caddy:2
    ports:
      - '127.0.0.1:8443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - demo_tls:/data
    depends_on:
      portal:
        condition: service_healthy
volumes:
  demo_database:
  demo_tls:
